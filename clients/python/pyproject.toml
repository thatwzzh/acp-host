[project]
name = "acp-host-client"
version = "0.1.7"
description = "acp-host 的薄客户端：起进程、按行 JSON 收事件"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"
keywords = ["acp", "agent", "ai-agent", "cli", "json-rpc"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/thatwzzh/acp-host"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["acp_host"]
